name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The pnpm toolchain requires node >= 22.13; node 20 runtime support is
        # covered by the node20-compat job below.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:deps
      # Runs the suite *and* enforces the 100% core branch threshold (ADR 0004).
      - run: pnpm coverage

  node20-compat:
    name: node 20 runtime compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm rather than pnpm: this job exists to prove the *code* runs on the
      # oldest supported runtime (package.json engines), not the dev toolchain.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
