name: Release

# Publishing is driven by a tag rather than by a push to main, so cutting a release is a
# deliberate act and the tag is the record of what was published.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: npm verifies the package was built by this workflow
      # from this commit. It matters more than usual for a tool that edits config files
      # on the user's machine.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, and Node 24 ships an older 11.x. Without
      # this the publish fails on OIDC rather than falling back to anything.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # The full gate again, on the exact commit being published. CI having been green on
      # main is not the same statement.
      - run: pnpm verify

      # A tag that disagrees with package.json would publish a version nobody asked for.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: pnpm build

      # The published package must contain the skill pack: without it `setup` deploys
      # nothing, and the failure would only show up on a user's machine.
      # Inspect the actual tarball rather than npm's --json report: the report's shape
      # has changed between npm versions, and this workflow upgrades npm on every run.
      # Listing the archive is stable and checks the artifact that really ships.
      - name: Check the skill pack is in the tarball
        run: |
          npm pack --silent
          tarball=$(ls ./*.tgz)
          count=$(tar -tzf "$tarball" | grep -c '^package/dist/skillpack/.*SKILL\.md$' || true)
          echo "SKILL.md files in the tarball: $count"
          if [ "$count" -lt 3 ]; then
            echo "the interface skill pack is missing from the tarball — setup would deploy nothing"
            tar -tzf "$tarball" | head -20
            exit 1
          fi
          rm -f "$tarball"

      # No token. Authentication is OIDC against the trusted publisher configured for
      # this package on npmjs.com, which must name this repository and this workflow
      # file. Provenance is attached automatically under trusted publishing, so
      # --provenance is not passed; --access public is still required the first time a
      # package is published.
      - run: npm publish --access public
